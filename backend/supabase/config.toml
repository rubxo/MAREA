# Local stack for Marea. Run commands from backend/ or use --workdir backend.
project_id = "marea"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "12MiB"

[analytics]
enabled = true
port = 55327
backend = "postgres"

[auth]
enabled = true
site_url = "marea://auth/callback"
additional_redirect_urls = ["exp://127.0.0.1:8081/--/auth/callback", "marea://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 4
sms_sent = 10
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 20
token_verifications = 20
web3 = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "10s"
otp_length = 6
otp_expiry = 3600
